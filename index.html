<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数独时光</title><link rel="stylesheet" href="style.css"><script src="utils/sudoku.js" defer></script><script src="web.js" defer></script></head><body><main><header><div><small>每天一点，专注时光</small><h1>数独时光</h1></div><span class="badge">SUDOKU</span></header><section class="toolbar"><label>难度 <select id="difficulty"><option value="0">轻松</option><option value="1">进阶</option><option value="2">挑战</option></select></label><time id="timer">00:00</time><button id="new">新游戏</button></section><p class="stats"><span id="status" role="status"></span><span id="stats"></span></p><div id="board" aria-label="数独棋盘"></div><div class="actions"><button id="undo">↶<small>撤销</small></button><button id="erase">⌫<small>擦除</small></button><button id="notes" aria-pressed="false">✎<small>笔记：关</small></button><button id="hint">☀<small>提示</small></button></div><div id="keyboard" aria-label="数字输入"></div><p class="tip">每行、每列、每个九宫格内，1–9 不重复。<br>支持数字键、方向键、删除键，按 N 切换笔记。</p><p id="saved">进度自动保存 · 随时回来继续</p></main></body></html>
